```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krishi AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
margin:0;
background:#f4f7fb;
}

/* HEADER */

.header{
background:#2e7d32;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:600;
}

.nav{
font-size:14px;
opacity:0.9;
}

/* HERO */

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
margin:0;
font-size:32px;
color:#222;
}

.hero p{
color:#666;
margin-top:10px;
}

/* MAIN CARD */

.container{
display:flex;
justify-content:center;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:450px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* FORM */

label{
font-size:14px;
font-weight:500;
margin-top:12px;
display:block;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

input:focus,select:focus{
border-color:#2e7d32;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#2e7d32;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#1b5e20;
}

/* RESULT */

.result-box{
margin-top:25px;
}

.result-card{
background:#f7f9fc;
padding:12px;
border-radius:6px;
margin-top:10px;
font-size:14px;
}

/* FOOTER */

.footer{
text-align:center;
padding:20px;
color:#888;
font-size:13px;
margin-top:30px;
}

</style>

</head>

<body>

<div class="header">
<div class="logo">🌾 Krishi AI</div>
<div class="nav">Crop Intelligence Platform</div>
</div>

<div class="hero">
<h1>AI Powered Crop Risk Prediction</h1>
<p>Predict crop disease risk, yield potential, and market decisions using machine learning.</p>
</div>

<div class="container">

<div class="card">

<form id="predictionForm">

<label>Crop Type</label>
<select id="crop_type">
<option value="Paddy">Paddy</option>
<option value="Wheat">Wheat</option>
<option value="Coffee">Coffee</option>
</select>

<label>Soil Type</label>
<select id="soil_type">
<option value="0">Clay</option>
<option value="1">Loam</option>
<option value="2">Sandy</option>
</select>

<label>Crop Stage</label>
<select id="crop_stage">
<option value="0">Early</option>
<option value="1">Mid</option>
<option value="2">Late</option>
</select>

<label>Soil Moisture (%)</label>
<input type="number" id="soil_moisture" required>

<label>Temperature (°C)</label>
<input type="number" id="temperature" required>

<label>Rainfall (mm)</label>
<input type="number" id="rainfall" required>

<label>Humidity (%)</label>
<input type="number" id="humidity" required>

<label>Fertilizer (kg/acre)</label>
<input type="number" id="fertilizer" required>

<button type="submit">Predict</button>

</form>

<div id="result" class="result-box"></div>

</div>

</div>

<div class="footer">
Krishi AI • Agricultural Decision Support System
</div>

<script src="./script.js"></script>

</body>
</html>
```
