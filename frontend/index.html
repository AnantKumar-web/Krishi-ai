```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#2e7d32,#66bb6a);
margin:0;
padding:40px 20px;
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
}

.container{
background:white;
width:100%;
max-width:450px;
padding:35px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

h1{
margin:0;
font-size:26px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

label{
font-weight:500;
font-size:14px;
display:block;
margin-top:15px;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

input:focus,select:focus{
outline:none;
border-color:#2e7d32;
}

button{
width:100%;
padding:14px;
margin-top:25px;
background:#2e7d32;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1b5e20;
}

.result-box{
margin-top:25px;
padding:15px;
background:#f5f5f5;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>🌾 Krishi AI</h1>
<p class="subtitle">Crop Risk & Market Intelligence System</p>

<form id="predictionForm">

<label>Crop Type</label>
<select id="crop_type">
<option value="Paddy">Paddy</option>
<option value="Wheat">Wheat</option>
<option value="Coffee">Coffee</option>
</select>

<label>Soil Type</label>
<select id="soil_type">
<option value="0">Clay</option>
<option value="1">Loam</option>
<option value="2">Sandy</option>
</select>

<label>Crop Stage</label>
<select id="crop_stage">
<option value="0">Early</option>
<option value="1">Mid</option>
<option value="2">Late</option>
</select>

<label>Soil Moisture (%)</label>
<input type="number" id="soil_moisture" required>

<label>Temperature (°C)</label>
<input type="number" id="temperature" required>

<label>Rainfall (mm)</label>
<input type="number" id="rainfall" required>

<label>Humidity (%)</label>
<input type="number" id="humidity" required>

<label>Fertilizer (kg/acre)</label>
<input type="number" id="fertilizer" required>

<button type="submit">Predict</button>

</form>

<div id="result" class="result-box"></div>

</div>

<script src="script.js"></script>

</body>
</html>
```
